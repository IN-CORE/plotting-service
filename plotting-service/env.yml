name: plotting-service
channels:
  - in-core
  - in-core/label/rc
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # app.py drives connexion 2's FlaskApp; connexion 3 is an ASGI rewrite
  - connexion>=2.8.0,<3
  - pyincore>=1.3.0
  - pyincore-viz>=1.5.0
  - gunicorn>=20.1.0
  - flask-cors>=3.0.10
  # pulled in by conda-forge urllib3; <1.2.1 is vulnerable to CVE-2026-111497
  - brotli-python>=1.2.1
